<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="v2uj2WtFnUSb9vfQ5UVvVLmdyfy8Q4C2B6uvFcIUI3M" />
  <title>Chess King | Play Real-Time Multiplayer Chess Online</title>
  <meta name="description" content="Play chess online with Chess King. Challenge your friends to direct multiplayer matches or join the matchmaking pool instantly on a premium real-time platform." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://chess-king-seven.vercel.app/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #030712; /* slate-950 */
      margin: 0;
      overflow: hidden;
    }
    .boot-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.05), transparent 45%);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
    }
    .loading-text {
      margin-top: 16px;
      color: #c4b5fd;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Custom Auto-Hiding Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
      transition: background 0.3s ease;
    }
    ::-webkit-scrollbar-thumb:hover,
    *:hover::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.4);
    }
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(139, 92, 246, 0.3) transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="root">
    <!-- Bootstrapping Loader -->
    <div class="boot-loader">
      <div class="spinner"></div>
      <div class="loading-text">Loading Chess King</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
